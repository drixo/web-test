apiVersion: batch/v1
kind: Job
metadata:
  generateName: school-site-publisher-
spec:
  ttlSecondsAfterFinished: 120
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: publisher
          image: alpine/git:latest
          command:
            - sh
            - -c
            - |
              set -ex
              apk add --no-cache rsync bash

              echo "Cloning repository..."
              mkdir -p /work
              git clone --depth 1 https://github.com/drixo/web-test.git /work

              echo "Syncing files to PVC..."
              rsync -r --no-perms --no-owner --no-group --no-times --chmod=ugo+rX \
                --exclude='.git' --exclude='.github' \
                /work/ /data/

              echo "Publish complete."
          volumeMounts:
            - name: site-data
              mountPath: /data
            - name: workdir
              mountPath: /work
      volumes:
        - name: site-data
          persistentVolumeClaim:
            claimName: school-site
        - name: workdir
          emptyDir: {}
